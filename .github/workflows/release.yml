name: Release & Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Setup Installer (ISCC)
        shell: powershell
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Distribution Package (Zip)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target\release\MiniLyricsV2_Setup.exe -Destination dist\MiniLyricsV2_Setup.exe
          Compress-Archive -Path target\release\minilyricv2.exe -DestinationPath dist\MiniLyricsV2_x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MiniLyrics V2 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/MiniLyricsV2_Setup.exe
            dist/MiniLyricsV2_x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
